[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "enzkin"
version = "1.0.0"
description = "Enzyme kinetics from plate-reader time courses: linear-range detection, replicate averaging and Prism-ready export"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.28"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
enzkin = "enzkin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
